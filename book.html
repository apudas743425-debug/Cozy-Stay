<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="book.css" />
    <title>Book Now</title>
  </head>
  <body>
    <main>
      <section class="book-now vh-100 overflow-hidden">
  <div class="row g-0 h-100">
    <div class="col-lg-6 d-none d-lg-block">
    </div>
    <!-- Right Side -->
    <div class="col-lg-6 col-md-12 bg-green-custom h-100 d-flex align-items-center">
      <div class="booking-para w-100">
        <a href="index.html" class="close-btn">
          <i class="fa-solid fa-xmark"></i>
        </a>
        <h1>Book Your Stay</h1>
        <p>
          Welcome to CozyStay Pacific Hotel. Nestled in the heart of the
          Pacific Islands resort, on the edge of a tranquil and beautiful
          Garden Island, CozyStay is a haven of warmth, tranquility and
          rejuvenation.
        </p>
        <div class="row">
          <div class="col-md-6 col-12 mb-3">
            <div class="booking-field">
              <label>Check In</label>
              <input type="date" value="2026-06-20" class="form-control">
            </div>
          </div>
          <div class="col-md-6 col-12 mb-3">
            <div class="booking-field">
              <label>Check Out</label>
              <input type="date" value="2026-06-21" class="form-control">
            </div>
          </div>
          <div class="col-md-6 col-12 mb-3">
            <div class="booking-field">
              <label>Rooms</label>
              <select class="form-select">
                <option>1 Room</option>
                <option>2 Rooms</option>
              </select>
            </div>
          </div>
          <div class="col-md-6 col-12 mb-3">
            <div class="booking-field">
              <label>Guests</label>
              <select class="form-select">
            <option>1 Adult, 0 Children</option>
            <option>2 Adults, 0 Children</option>
            <option>2 Adults, 1 Child</option>
            <option>2 Adults, 2 Children</option>
              </select>
            </div>
          </div>
        </div>
        <a href="#" class="btn-check-availability">
          Check Availability
        </a>
        <div class="booking-notes">
          <span><i class="fa-solid fa-circle"></i> Check-in: 3pm</span>
          <span><i class="fa-solid fa-circle"></i> Check-out: 11am</span>
          <span><i class="fa-solid fa-circle"></i> Minimum Check-in Age: 18</span>
        </div>
      </div>
    </div>
  </div>
</section>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
